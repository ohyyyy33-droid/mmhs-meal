name: 급식 데이터 업데이트
on:
  schedule:
    - cron: "17 20 * * *"   # 매일 한국시간 새벽 5시 17분
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_meals.py
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add meals.json
          git diff --cached --quiet || git commit -m "급식 데이터 업데이트"
          git push
